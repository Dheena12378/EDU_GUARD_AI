# ============================================================
# EDU CARD AI — Support Playbook
# Maps engagement factors → optional support suggestions
# All suggestions are OPTIONAL and require human review
# ============================================================

factors:
  attendance:
    display_name: "Attendance"
    suggestions:
      - type: "attendance_followup"
        title: "Attendance Follow-up"
        description: "A brief, supportive check-in about recent attendance patterns"
        priority: 1
      - type: "academic_counseling"
        title: "Academic Counseling Referral"
        description: "Optional referral to academic counseling services for additional support"
        priority: 2

  assignment_completion:
    display_name: "Assignment Completion"
    suggestions:
      - type: "assignment_support"
        title: "Assignment Support"
        description: "Offer additional time, resources, or clarification for pending assignments"
        priority: 1
      - type: "study_material"
        title: "Additional Study Material"
        description: "Share supplementary materials that may help with current topics"
        priority: 2

  assessment_score:
    display_name: "Assessment Score"
    suggestions:
      - type: "extra_practice"
        title: "Extra Practice Exercises"
        description: "Provide optional practice problems for challenging topics"
        priority: 1
      - type: "mentor_discussion"
        title: "Mentor Discussion"
        description: "Schedule a supportive one-on-one discussion with assigned mentor"
        priority: 2

  learning_activity:
    display_name: "Learning Activity"
    suggestions:
      - type: "mentor_discussion"
        title: "Mentor Discussion"
        description: "A supportive conversation about learning goals and any challenges"
        priority: 1
      - type: "study_material"
        title: "Additional Study Material"
        description: "Share engaging resources related to current coursework"
        priority: 2

  class_participation:
    display_name: "Class Participation"
    suggestions:
      - type: "mentor_discussion"
        title: "Mentor Discussion"
        description: "Explore ways to support comfortable participation in class"
        priority: 1
      - type: "attendance_followup"
        title: "Supportive Check-in"
        description: "A brief, friendly check-in to understand any barriers to participation"
        priority: 2

  missed_submissions:
    display_name: "Missed Submissions"
    suggestions:
      - type: "assignment_support"
        title: "Assignment Support"
        description: "Discuss any obstacles to completing submissions and offer flexibility"
        priority: 1
      - type: "academic_counseling"
        title: "Academic Counseling Referral"
        description: "Consider connecting with counseling services for additional guidance"
        priority: 3

# Disclaimer text — shown wherever an indicator appears
disclaimer: >
  This Early Support Indicator is generated by an AI system to assist faculty
  and mentors. It is NOT a judgment, ranking, or prediction of student outcome.
  The indicator suggests that this student may benefit from a supportive
  check-in. All suggestions are optional. The final decision always rests with
  the faculty member or mentor.

# Banned words and phrases — must NEVER appear in UI text or API responses
banned_words:
  - "at-risk"
  - "at risk"
  - "failing"
  - "will fail"
  - "predicted to fail"
  - "will drop out"
  - "dropout"
  - "drop out"
  - "failure"
  - "poor student"
  - "weak student"
  - "underperforming"
  - "low performer"
  - "bottom"
  - "worst"
  - "ranked last"
  - "hopeless"
  - "lost cause"
